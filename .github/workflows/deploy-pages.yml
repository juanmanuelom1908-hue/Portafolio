name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install root dependencies
        run: npm install

      - name: Install Football Card Builder dependencies
        run: npm install
        working-directory: ./football-card-builder/client
        

      - name: Build Football Card Builder
        run: npm run build
        working-directory: ./football-card-builder/client
        env:
          VITE_API_URL: ${{ secrets.VITE_FOOTBALL_API_URL }}

      - name: Install Superhero dependencies 
        run: npm install 
        working-directory: ./powers-form/client-vite-temp

      - name: Build Superhero 
        run: npm run build
        working-directory: ./powers-form/client-vite-temp
        env: 
           VITE_API_URL: ${{ secrets.VITE_SUPERHERO_API_URL }} 

      - name: Build combined site
        run: |
          mkdir -p site/superhero
          mkdir -p site/weather
          mkdir -p site/motorcycle-shop
          mkdir -p site/football-card-builder

          cp -r ./powers-form/client-vite-temp/dist/* site/superhero/
          cp -r ./weather-project/client/* site/weather/

          cp "./Motorcycle Shop/client/index.html" site/motorcycle-shop/
          cp "./Motorcycle Shop/client/index.js" site/motorcycle-shop/
          cp "./Motorcycle Shop/client/styles.css" site/motorcycle-shop/

          cp -r ./football-card-builder/client/dist/* site/football-card-builder/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload combined site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4