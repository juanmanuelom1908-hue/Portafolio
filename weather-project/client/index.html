<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet" />
    <style>
      body { font-family: 'Inter', sans-serif; }
      #weather-card { display: none; }
      #weather-card.show { display: block; }
      .spinner { display: none; }
      .spinner.show { display: block; }
    </style>
  </head>

  <body class="min-h-screen bg-gradient-to-br from-slate-900 via-blue-950 to-slate-900 flex items-center justify-center p-4">

    <div class="w-full max-w-md">

      <!-- Title -->
      <h1 class="text-white text-3xl font-bold text-center mb-8 tracking-tight">
        🌤 Weather App
      </h1>

      <!-- Search -->
      <div class="bg-white/10 backdrop-blur-md rounded-2xl p-4 flex gap-2 mb-6 border border-white/20">
        <input
          id="city-input"
          type="text"
          placeholder="Search any city..."
          class="flex-1 bg-transparent text-white placeholder-white/50 outline-none text-sm px-2"
        />
        <button
          id="get-weather-btn"
          class="bg-blue-500 hover:bg-blue-400 text-white text-sm font-semibold px-4 py-2 rounded-xl transition-all duration-200"
        >
          Search
        </button>
      </div>

      <!-- Quick select -->
      <div class="flex flex-wrap gap-2 mb-6 justify-center">
        <span class="text-white/50 text-xs self-center">Quick:</span>
        <button onclick="quickSearch('New York')" class="quick-btn text-xs text-white/70 border border-white/20 rounded-full px-3 py-1 hover:bg-white/10 transition">New York</button>
        <button onclick="quickSearch('London')" class="quick-btn text-xs text-white/70 border border-white/20 rounded-full px-3 py-1 hover:bg-white/10 transition">London</button>
        <button onclick="quickSearch('Tokyo')" class="quick-btn text-xs text-white/70 border border-white/20 rounded-full px-3 py-1 hover:bg-white/10 transition">Tokyo</button>
        <button onclick="quickSearch('Paris')" class="quick-btn text-xs text-white/70 border border-white/20 rounded-full px-3 py-1 hover:bg-white/10 transition">Paris</button>
        <button onclick="quickSearch('Chicago')" class="quick-btn text-xs text-white/70 border border-white/20 rounded-full px-3 py-1 hover:bg-white/10 transition">Chicago</button>
      </div>

      <!-- Loading -->
      <div class="spinner text-center py-8" id="spinner">
        <div class="inline-block w-8 h-8 border-4 border-white/20 border-t-blue-400 rounded-full animate-spin"></div>
      </div>

      <!-- Error -->
      <div id="error-msg" class="hidden bg-red-500/20 border border-red-400/30 text-red-300 text-sm rounded-xl px-4 py-3 mb-4 text-center"></div>

      <!-- Weather Card -->
      <div id="weather-card" class="bg-white/10 backdrop-blur-md rounded-2xl p-6 border border-white/20">

        <!-- Location + icon -->
        <div class="flex items-center justify-between mb-4">
          <div>
            <p id="location" class="text-white text-2xl font-bold"></p>
            <p id="weather-main" class="text-white/60 text-sm capitalize"></p>
          </div>
          <img id="weather-icon" src="" alt="weather icon" class="w-16 h-16" />
        </div>

        <!-- Main temp -->
        <div class="flex items-end gap-3 mb-6">
          <p id="main-temperature" class="text-white text-6xl font-light"></p>
          <div class="flex gap-2 mb-3">
            <button id="btn-c" onclick="setUnit('C')" class="text-xs text-blue-300 font-semibold border-b border-blue-300 pb-0.5">°C</button>
            <span class="text-white/30 text-xs">|</span>
            <button id="btn-f" onclick="setUnit('F')" class="text-xs text-white/40">°F</button>
          </div>
        </div>

        <!-- Details grid -->
        <div class="grid grid-cols-2 gap-3">
          <div class="bg-white/5 rounded-xl p-3">
            <p class="text-white/40 text-xs mb-1">Feels like</p>
            <p id="feels-like" class="text-white font-semibold"></p>
          </div>
          <div class="bg-white/5 rounded-xl p-3">
            <p class="text-white/40 text-xs mb-1">Humidity</p>
            <p id="humidity" class="text-white font-semibold"></p>
          </div>
          <div class="bg-white/5 rounded-xl p-3">
            <p class="text-white/40 text-xs mb-1">Wind speed</p>
            <p id="wind" class="text-white font-semibold"></p>
          </div>
          <div class="bg-white/5 rounded-xl p-3">
            <p class="text-white/40 text-xs mb-1">Wind gust</p>
            <p id="wind-gust" class="text-white font-semibold"></p>
          </div>
        </div>

      </div>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
